server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name caja.suturesistemas.com;
    ssl_certificate /etc/letsencrypt/live/caja.suturesistemas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caja.suturesistemas.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/suture-caja-app.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name caja.216.238.119.80.sslip.io;
    ssl_certificate /etc/letsencrypt/live/caja.216.238.119.80.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caja.216.238.119.80.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/suture-caja-app.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name caja.suturesistemas.com caja.216.238.119.80.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/_letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
