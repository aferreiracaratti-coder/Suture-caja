spring.application.name=suture-caja
server.port=${CAJA_PORT:8095}
spring.datasource.url=${CAJA_DB_URL:jdbc:postgresql://127.0.0.1:5432/suture_caja}
spring.datasource.username=${CAJA_DB_USERNAME:caja}
spring.datasource.password=${CAJA_DB_PASSWORD:}
spring.flyway.enabled=true
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health,info
server.error.include-message=never
caja.bootstrap.organization=${CAJA_BOOTSTRAP_ORGANIZATION:}
caja.bootstrap.username=${CAJA_BOOTSTRAP_USERNAME:}
caja.bootstrap.password=${CAJA_BOOTSTRAP_PASSWORD:}
caja.print.url=${CAJA_PRINT_URL:}
caja.print.token=${CAJA_PRINT_TOKEN:}
