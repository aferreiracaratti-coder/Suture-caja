services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: suture_caja_demo
      POSTGRES_USER: caja
      POSTGRES_PASSWORD: ${CAJA_DB_PASSWORD:?Definir CAJA_DB_PASSWORD}
    ports:
      - "127.0.0.1:55435:5432"
    volumes:
      - caja_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caja -d suture_caja_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  caja_pgdata:
